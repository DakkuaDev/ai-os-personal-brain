<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2f"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="hubGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- subtle grid dots -->
  <g fill="#1e293b">
    <circle cx="80" cy="80" r="1.6"/><circle cx="200" cy="120" r="1.6"/><circle cx="340" cy="60" r="1.6"/>
    <circle cx="520" cy="110" r="1.6"/><circle cx="760" cy="70" r="1.6"/><circle cx="920" cy="140" r="1.6"/>
    <circle cx="1080" cy="80" r="1.6"/><circle cx="1200" cy="150" r="1.6"/><circle cx="120" cy="240" r="1.6"/>
    <circle cx="60" cy="420" r="1.6"/><circle cx="1160" cy="420" r="1.6"/><circle cx="1220" cy="560" r="1.6"/>
    <circle cx="180" cy="580" r="1.6"/><circle cx="420" cy="560" r="1.6"/><circle cx="860" cy="580" r="1.6"/>
    <circle cx="1100" cy="580" r="1.6"/><circle cx="640" cy="520" r="1.6"/><circle cx="640" cy="170" r="1.6"/>
  </g>

  <!-- connector lines -->
  <g stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2" fill="none">
    <line x1="640" y1="330" x2="270" y2="210"/>
    <line x1="640" y1="370" x2="270" y2="490"/>
    <line x1="640" y1="330" x2="1010" y2="210"/>
    <line x1="640" y1="370" x2="1010" y2="490"/>
    <line x1="640" y1="300" x2="640" y2="150"/>
    <line x1="640" y1="410" x2="640" y2="540" stroke-dasharray="5 6"/>
  </g>

  <!-- satellites -->
  <g font-family="'Inter','Segoe UI',system-ui,sans-serif" text-anchor="middle">
    <!-- Finance -->
    <circle cx="270" cy="210" r="40" fill="#0f2740" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="270" y="206" fill="#22d3ee" font-size="15" font-weight="600">Finance</text>
    <text x="270" y="224" fill="#64748b" font-size="11">Midas</text>
    <!-- Career -->
    <circle cx="270" cy="490" r="40" fill="#0f2740" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="270" y="486" fill="#22d3ee" font-size="15" font-weight="600">Career</text>
    <text x="270" y="504" fill="#64748b" font-size="11">Compass</text>
    <!-- Health -->
    <circle cx="1010" cy="210" r="40" fill="#0f2740" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="1010" y="206" fill="#22d3ee" font-size="15" font-weight="600">Health</text>
    <text x="1010" y="224" fill="#64748b" font-size="11">Vital</text>
    <!-- Research -->
    <circle cx="1010" cy="490" r="40" fill="#0f2740" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="1010" y="486" fill="#22d3ee" font-size="15" font-weight="600">Research</text>
    <text x="1010" y="504" fill="#64748b" font-size="11">Sage</text>
    <!-- Studies -->
    <circle cx="640" cy="150" r="40" fill="#0f2740" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="640" y="146" fill="#22d3ee" font-size="15" font-weight="600">Studies</text>
    <text x="640" y="164" fill="#64748b" font-size="11">Scholar</text>
    <!-- Your bots (dashed) -->
    <circle cx="640" cy="540" r="40" fill="none" stroke="#64748b" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="640" y="536" fill="#94a3b8" font-size="14" font-weight="500">Your bots</text>
    <text x="640" y="553" fill="#64748b" font-size="10">+ any domain</text>
  </g>

  <!-- CEO hub -->
  <g font-family="'Inter','Segoe UI',system-ui,sans-serif" text-anchor="middle">
    <circle cx="640" cy="340" r="62" fill="url(#hub)" filter="url(#hubGlow)" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2.5"/>
    <text x="640" y="330" fill="#ffffff" font-size="24" font-weight="700">CEO</text>
    <text x="640" y="354" fill="#a5f3fc" font-size="12" font-weight="500">single deliver agent</text>
    <text x="640" y="392" fill="#7dd3fc" font-size="12">reports → one digest → you</text>
  </g>

  <!-- title -->
  <g font-family="'Inter','Segoe UI',system-ui,sans-serif">
    <text x="80" y="110" fill="#f8fafc" font-size="46" font-weight="800" letter-spacing="-1">Agent-First Life OS</text>
    <text x="82" y="150" fill="#94a3b8" font-size="19" font-weight="400">A replicable blueprint for a personal fleet of AI agents — one CEO, specialist bots, memory on disk.</text>

    <g transform="translate(0,0)">
      <rect x="78" y="592" width="164" height="30" rx="15" fill="#0f2740" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="160" y="612" fill="#7dd3fc" font-size="13" font-weight="500" text-anchor="middle">Hermes-ready</text>
      <rect x="254" y="592" width="146" height="30" rx="15" fill="#0f2740" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="327" y="612" fill="#7dd3fc" font-size="13" font-weight="500" text-anchor="middle">AI-agnostic</text>
      <rect x="412" y="592" width="140" height="30" rx="15" fill="#0f2740" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="482" y="612" fill="#7dd3fc" font-size="13" font-weight="500" text-anchor="middle">Local-first</text>
      <rect x="564" y="592" width="92" height="30" rx="15" fill="#0f2740" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="610" y="612" fill="#7dd3fc" font-size="13" font-weight="500" text-anchor="middle">MIT</text>
    </g>

    <!-- corner marks -->
    <text x="1200" y="110" fill="#22d3ee" font-size="15" font-weight="600" text-anchor="end" opacity="0.85">DakkuaDev · 2026</text>
  </g>
</svg>
